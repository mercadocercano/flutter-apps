server {
  listen 3000;
  root /usr/share/nginx/html;
  index index.html;

  # Shell de la app: SIEMPRE revalidar. Esto fuerza al service worker
  # a actualizarse y a refetchear el bundle nuevo sin hard-refresh manual.
  location = /index.html               { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /flutter_service_worker.js { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /flutter_bootstrap.js     { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /main.dart.js             { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /version.json             { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /manifest.json            { add_header Cache-Control "no-cache, no-store, must-revalidate"; }

  # Assets con contenido versionado (hash en el path): cache largo seguro.
  location ~* ^/(assets|canvaskit|icons)/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
