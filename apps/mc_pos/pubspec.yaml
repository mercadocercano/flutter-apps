name: mc_pos
description: POS de Mercado Cercano — punto de venta para comercios de barrio.
publish_to: 'none'
version: 0.1.0+1

resolution: workspace

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  mc_domain:
    path: ../../packages/mc_domain
  mc_application:
    path: ../../packages/mc_application
  mc_infrastructure:
    path: ../../packages/mc_infrastructure
  mc_design_system:
    path: ../../packages/mc_design_system
  mc_hardware:
    path: ../../packages/mc_hardware
  flutter_bloc: ^9.1.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  # Impresión / compartir del PDF A4 generado por el backend (E18 Tramo C).
  printing: ^5.13.3
  # Disponible para fallback de render en cliente si el endpoint de PDF
  # del backend no estuviera listo (hoy preferimos consumir el del backend).
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
