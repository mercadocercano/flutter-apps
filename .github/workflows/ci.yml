name: Flutter CI — mc_pos

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FLUTTER_VERSION: '3.32.0'

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bootstrap workspace
        run: dart pub get && dart run melos bootstrap

      - name: Analyze
        run: dart run melos analyze

      - name: Test
        run: dart run melos test

      - name: Notify Telegram on failure
        if: failure()
        run: |
          MSG=$(printf '❌ FAILED: flutter CI\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$MSG"

  build-apk:
    name: Build mc_pos APK
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Bootstrap workspace
        run: dart pub get && dart run melos bootstrap

      - name: Build APK (release)
        working-directory: apps/mc_pos
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} \
            --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mc_pos-${{ github.sha }}
          path: apps/mc_pos/build/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Notify Telegram on success
        if: success()
        run: |
          MSG=$(printf '✅ APK BUILD OK: mc_pos\nCommit: ${{ github.sha }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nDescargá desde Actions → Artifacts')
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$MSG"

      - name: Notify Telegram on failure
        if: failure()
        run: |
          MSG=$(printf '❌ APK BUILD FAILED: mc_pos\nCommit: ${{ github.sha }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="$MSG"
