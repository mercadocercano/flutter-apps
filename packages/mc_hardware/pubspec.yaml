name: mc_hardware
description: Ports y adaptadores de hardware comercial - balanza, impresora térmica, scanner.
version: 0.1.0
publish_to: 'none'

resolution: workspace

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  mc_domain:
    path: ../mc_domain
  mc_application:
    path: ../mc_application
  # Formato ESC/POS — fork mantenido (Dart 3) del abandonado esc_pos_utils.
  esc_pos_utils_plus: ^2.0.4
  # Transporte Bluetooth clásico (SPP) para impresoras térmicas 58/80mm.
  print_bluetooth_thermal: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
