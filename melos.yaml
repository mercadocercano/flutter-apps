name: mercado_cercano
repository: https://github.com/mercadocercano/mercado-cercano

packages:
  - packages/**
  - apps/**

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: dart analyze --fatal-infos
    exec:
      concurrency: 5
    description: Run dart analyze in all packages

  test:
    run: dart test
    exec:
      concurrency: 5
      failFast: true
    packageFilters:
      dirExists: test
    description: Run tests in all packages

  format:
    run: dart format --set-exit-if-changed .
    description: Format all Dart files

  clean:
    run: flutter clean
    exec:
      concurrency: 5
    description: Clean all packages
